[package]
name = "aurora-kernel"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "aurora-kernel"
path = "src/main.rs"

# 手册 §1.3 第 7 条（R19）：[workspace.lints] 不会自动作用到成员 crate，
# 必须在这里显式接入。**删掉这三行不会让构建失败，只会让 lint 门禁静默空转**，
# 所以 tools/aurora.py 的 check-lints-wired 会专门检查这一项。
[lints]
workspace = true

[features]
default = []
# 负样本：让 ktest 里的一条断言故意不成立，用于证明判定契约的尺子能分辨
# （手册 §12.3 R19）。正常运行时不得带这个 feature 合入。
negative-probe = []
# M5-g① 取证：把每台设备的 MSI/MSI-X 块与 INTx pin/line 读成一张证人表。
# 只读不改，也不进四把尺子的构建：量具的开销不能算进产品基线（与 sig-check 同一形状）。
irq-probe = []
# 故障注入（手册 §12.1 L5 / §9.2）：制造一次真实的重复释放。
# L4 升级必须生效，否则该构建会以 35 而不是 39 收场。
fault-double-free = []
# 故障注入（P1c / ADR-063）：共享帧 frame_put 到 0 之后再 put 一次，验证 refcnt 的
# DoubleFree 判定升 L4。与 fault-double-free 同构，但走的是 frame_put 这条共享路径。
fault-put-double-free = []
# 故障注入（ADR-066 / W2 P4）：split_huge 取 PT 页的调用点强制失败，验证 OOM 时
# 原大页原样、台账与 free_frames 回基线。失败被传播（Err）而不是 L4，故该构建期望整体 PASS。
fault-split-oom = []
# 竞争放大变体（ADR-067 / W2 P5）：在 demand_zero_try 的"分配之后、装页之前"注入
# 2M 周期自旋，把已查未填→alloc→map 的窗口拉宽，让四路（3AP+BSP）竞争者确定性重叠，
# 输家路径（AlreadyMapped→还帧）才会**必然**被执行到——TCG 默认串行化会饿死这条分支，
# 饿死时的"输家还帧=0"是空转判据，不能当证据（§134/ADR-054 口径）。
race-demand-zero = []
# 故障注入（ADR-018）：要一个超过大小类上限的分配，验证全局分配器的失败出口
# null -> handle_alloc_error -> panic -> 39。没有这个构建，ADR-018 只能靠文档承诺。
fault-heap-oom = []
# 故障注入（§12.3 R19 要求每道门禁各有负样本）：故意泄漏一帧物理页。
# 资源台账（§6.7 的"按模块汇总存活分配"）必须把 MOD_TEST 的存活数报成非 0。
fault-resource-leak = []

# 负样本（§6.5/§7.1）：在定时器中断的处理路径里走一次全局分配器。
# 中断上下文分配检测器必须抓到它，否则这条禁令只是注释。
fault-alloc-in-irq = []

# 负样本（§7.1 R16）：同一上下文重复获取堆锁。held_by 必须认出并升 L4，
# 否则"重入即死锁"这件事今天没人能证明它被抓得住。
fault-lock-reentrant = []

# 负样本（ADR-081 决策 4）：同一上下文重复获取 GROW(4)，必须被 held_by 认出并升 L4。
fault-grow-reentrant = []

# 负样本（ADR-081 决策 4）：反向嵌套——持 HEAP(10) 再取 GROW(4)，必须被锁序检测认出并升 L4。
fault-grow-order = []

# 负样本（ADR-081 决策 1 条件②）：去掉"最内层等级 < TIMER(6)"这道闸 ⇒ 持 HEAP(10) 等 VMM 时
# 也开窗，tick 进来取 TIMER(6) 应撞 `锁序违规，外层 rank=10 本次 rank=6`。
fault-open-no-rank-guard = []

# 负样本（ADR-081 决策 2）：把 TIMER 误标成"从不在中断里取" ⇒ 等 TIMER 时开窗，
# 自己的 tick 进来再取同一把锁 ⇒ 应撞 `重入获取 rank=6`。
fault-timer-marked-taskonly = []

# 负样本（ADR-081 决策 1/2）：把 VMM 标回"中断里也取" ⇒ 等 VMM 时不开窗 ⇒ §204 死锁应回来。
fault-vmm-no-open = []

# 负样本（ADR-021）：把"IF 属于 CPU"改回硬件默认的"任务自己带 IF"。
# 这条构建用来证明 ADR-021 不是修辞——去掉机制，M3a 记录过的故障形状必须回来。
fault-if-carriage = []

# 负样本（§5.1 R17）：把 CR4.SMAP 清掉。SMEP/SMAP 是**必需项**，
# 必需项的判断必须有能让它变红的注入，否则"没开成功就不启动"这句话没人验证过。
fault-no-smap = []

# 负样本（§6.6）：收到 shootdown 请求的 CPU 照常 invlpg，但**不回执**。
# 请求方必须在有界等待到期时升 L4——否则它会以为可以安全归还那块物理页。
fault-shootdown-noack = []

# 负样本（欠账⑦ / ADR-062）：resched IPI 发送一律失败（在 request_resched 的记账点强制
# 走 Err 分支，只影响 resched，不动 shootdown）。健康 QEMU 上 IPI 从不失败，所以
# resched_ipi_fail() 这个计数平时恒 0、没人能证明它会咬。这条构建强制它失败，验证：
# 计数真的涨、收到的 IPI 为 0、且**失败不丢唤醒**——目标任务已是 Runnable，靠它自己的
# 下一次 tick 仍被选上。三条依赖跨核 IPI 送达的用例（t_cross_cpu_resched / t_cross_cpu_wait /
# t_idle_hlt_wakes）在本特性下不注册，由 t_resched_ipi_fail_fallback 取代它们量这条路径。
fault-resched-ipi = []

# 负样本（§8.7.2 与 §12.3 R19）：把第二次块读的 LBA 标签打成第一次的那个。
# 内核自判的内容见证（MBR 签名、`EFI PART`、两次哈希不同）在注入下**照样全绿**，
# 只有 `tools/aurora.py` 的宿主机对账会翻车 —— 这条构建证明的是那把尺子能分辨。
fault-ahci-lba = []

# 变体（§8.7.2 M5-c②）：这台机器多挂第二块 130 GiB 的 qcow2（由 tools/aurora.py 造好并挂到
# 口 2），用它把 LBA 的高位字节钉住。带这个特性就必须带那块盘：驱动找不到第二块盘时
# 用例会**红**，不会静默跳过——否则这条判据就变成"没人过的分支"。
ahci-scratch = []

# M5-f：挂上 virtio-blk 那台设备时才注册的取证用例（`KT_VIRTIO_PROBE`）。
# 默认构建里这台设备不存在（QEMU 命令行由 `tools/aurora.py` 按特性加），
# 所以不带这个特性跑，用例不注册、判据也不会假装"过了"。
virtio-blk = []
# M8-a：第一张网卡（virtio-net）的用例。与块设备同一理由——不带这个特性时 QEMU 命令行上
# 根本没有这台设备，用例不注册，判据也不会假装"过了"。
virtio-net = []
# M9-a：SHA-256 的向量用例（`KT_SHA256`）。放进单独一个变体不是为了省时间，是因为这一格要打印
# 13 条摘要，串口量一涨 P4 的绝对数就与别的轮次不可比（§12.4.1 规则 2）
sig-check = []
# 故障注入（§9.7 / M6-d）：核心态故意读一个未映射地址 ⇒ #PF(14) 没有恢复项 ⇒ Action::Fatal
# ⇒ 39。这一格存在的唯一理由是让崩溃记录里的向量/CR2/RIP/调用栈由 **CPU 给的现场** 填出来，
# 而不是用例自己填的数。没有这个构建，V2 那 12 个字段测的只是搬运工。
fault-crash-oops = []

# 自查（W4 猎间歇挂，BACKLOG §181）：无锁现场记录表的**端到端**取证自查。写一个每格都不同的
# 现场再 `cli+hlt` 停住，宿主机超时后用 `pmemsave` 读回那张表与串口那行数对账。
# 这一档自己期望 HANG，所以**不进判定矩阵**（一行 120s 的墙钟不能常挂在矩阵里），
# 由 `tools/aurora.py` 的 `fatal-probe-selfcheck` 入口单独跑；也不进四把尺子。
fatal-record-stall = []
# 自查（W4 猎间歇挂，BACKLOG §184 / ADR-079 补记二）：把 §180 抓到的那个形状**做成确定会发生的一次**。
# 真 `#PF(14)` 由 `fault-crash-oops` 那颗 deliberate 读制造（本档**依赖**它，自己不带 unsafe 现场），
# 致命入口先把 CPU 给的现场写进无锁表，然后 `dump_site` 停在**写盘之前**自旋 ⇒ 这一跑必挂。
# 宿主机超时后用 `pmemsave` 读回那张表：念得出 向量=14 与串口 `[fatal]` 同一条的 rip/cr2/err，
# 且那一槽停在 stage=2（等不到 stage=3）——这才叫"表能在真挂死那一跑被读一次"。
# 与 `fatal-record-stall` 分开两档：那一档量的是**布局与地址推导**（合成五个 magic），
# 这一档量的是**真异常现场 + 停在哪个进度点**；两档各自期望 HANG，都不进矩阵也不进 bench。
fatal-record-dump-stall = ["fault-crash-oops"]

# 负样本（M5-c③）：写命令把扇区数按 1 个编程（内容与回读都按 8 个准备）。
# 这条**能咬**：8 个扇区里只有第一个是图案 ⇒ 逐字节比对当场不一致。
# 与之对照，`fault-ahci-write-dir`（丢 DW0 的 W 位）在本机测出来是**不可见**的
# （方向由命令字节 0x35 决定，QEMU 不看 W 位），所以那条只当记录，不当判据。
fault-ahci-write-partial = ["ahci-scratch"]
# 变体（M5-g④，BACKLOG 71）：服务与起口路径上都不清 `PxIS`，只留接入时那一次初始清。
# 这台 QEMU 的 AHCI 中断是电平线，位留着线就恒高，后来的完成不再成为消息——
# 这一格把「MSI 消息只由低到高的边沿产生」从推断升成能变红的判据（判定矩阵第 29 行）。
irq-sticky-pxis = []
# 变体（L3-A，BACKLOG 72）：跑一轮"每个在线 CPU 同时打一批行"的并发打印，内核数账、
# 宿主机数行的形状（判定矩阵第 31 行）。不进正常构建也不进四把尺子：
# 常态下一行 ≈130 字节的串口输出会挪动 P2/P4 的绝对数，而这一格要量的是行锁，不是产品热路径。
serial-atomic-probe = []
serial-rx-probe = []
console-probe = ["handles"]
# 变体（L3-B 亲和性那一步，BACKLOG 73）：把 AHCI 那颗 MSI 的目的地移到一颗上线的 AP 上，
# 再做一次真读，看投递到底落到哪颗 CPU。判据是两台仪器各数一遍：
# 内核数 `irq::by_cpu()` 的槽分布，宿主机拿 `-d int` 里 `SP` 的高位分 BSP／非 BSP（BACKLOG 68e 那条）。
# 不进正常构建：它会把目的地挪走，而第 28 行的"非 BSP 必须为 0"读的是常态形状。
irq-affinity-probe = []
# 变体（L3-B MSI-X，BACKLOG 75）：给 virtio-blk 的队列 0 编一条 MSI-X 表条目并真跑一次读盘。
# 依赖 virtio-blk——没有那台设备就没有那张表可编；带这个特性就必须挂那块盘（`VBLK_FEATURES` 已含它），
# 否则用例会因为"设备不在"而红，不会静默跳过。
virtio-msix-probe = ["virtio-blk"]
# 变体（L3-C①，BACKLOG 78）：FAT32 只读解析的真调用点。挂两块 FAT32 卷（口 3 与口 4，
# 由 tools/aurora.py 的 FAT_PORTS 定），一块当阈值判型的反例、一块把文件推到 65,536 簇之上。
# 不进正常构建也不进四把尺子：每簇一次读 ⇒ 一轮走链要发几百条块命令，取证行的量会挪动串口量。
fat32-probe = []

# 变体（L3-C③，BACKLOG 78h-1）：把用户镜像的来源从 `include_bytes!` 换成卷A 上的 `HELLO.ELF`，
# 装进用户窗口并真跑一遍。依赖探针——没有那两条用例就没有"同一份容器的另一条路"可比。
# 同样不进正常构建也不进四把尺子：一次走链 401 条块命令，加上一次真跑用户任务。
fat32-exec = ["fat32-probe", "handles"]
# 变体（W4 S1，ADR-078）：GPT 只读解析的取证用例（`KT_GPT`）。与 fat32-probe/sig-check 同一理由
# 不进正常构建也不进四把尺子：扫一次条目数组要读 16 KiB（32 个扇区）加备份头，块命令数与串口量
# 都会涨，而 P4 那把尺子量的就是串口量。不带这个特性时 `filesystem::gpt` 整个模块不编译，
# 默认构建的 ELF 一个字节不动（现有 46 行判定矩阵因此不需要重钉期望值）。
gpt-probe = []
# 变体（W4 S2a，ADR-078）：FAT16 只读判型与读路径的取证用例（`KT_FAT16`），载体是合成整卷。
# 与 fat32-probe 分开一档：FAT16 的判据不该与 FAT32 那六行绑在一起（改一处注入会互相波及，
# ADR-038 证红第 4 条撞过）。同样不进正常构建也不进四把尺子。
fat16-probe = []
# 变体（W4 S2b，ADR-078 补记七 / ADR-077 补记）：从口 0 的 ESP **分区偏移**里真读一个已存在的
# 文件（LIMINE.CON）。依赖 S1 的分区表解析与 S2a 的 FAT16 读路径——少了任何一条这一档就没有被测物。
# 不进正常构建也不进四把尺子：一次 GPT 扫描要读 16 KiB 条目数组加备份头，块命令数与串口量都会涨。
esp-probe = ["gpt-probe", "fat16-probe", "handles"]
# P7：用户 capability 句柄表（16 格、slot:u16+gen:u48）。只在特性档里编译/置位 ABI 位：
# 正常构建没有表 ⇒ 8/9/10 走默认分支回 -1，F_HANDLES 读回 false（与手册 §10.2 的纪律一致）。
handles = []
# 负样本（P7 §9 F）：把装载器授予的 owner 改错一格（Task::id ^ 1）。
# 容器读自己的句柄必须 NotOwner ⇒ 判定链这一行期望 FAIL；证明"授予给谁"不是修辞。
fault-handle-owner = []
# §194 负样本：把 wait_for_task 里"查条件之后、block_current 之前"那个窗口故意撑大。
# 推导见 BACKLOG §194：目标若在窗口里收工，drain 会对着还没 Blocked 的等待者调 wake_task，
# 失败被 `let _ =` 吞掉 ⇒ 槽已 WOKEN 而 ARMED/PENDING 归零，之后 block_current 永久停住。
fault-wait-race = []


# 负样本（M5-c③）：写命令不置 DW0 的 W 位（真驱动最容易犯的方向错）。
# 这台 QEMU 到底会不会因此不写、少写还是照写，是要量出来的事实；如果它照样写成功，
# 那"完成取证"就不足以当判据，必须靠回读与宿主机对账 —— 两种结果都要记进 ADR。
fault-ahci-write-dir = ["ahci-scratch"]

# 负样本（M5-c②）：把 LBA 字节 8 按 `>>32` 写（= 我第一版的真错误）。设备于是读到 LBA 0
# 的全零扇区而不是 `0xA5` 图案 ⇒ `KT_AHCI_HIGH_LBA` 必须红。
fault-ahci-highlba = ["ahci-scratch"]

# 负样本（§8.7.2 / ADR-029）：把扇区数的高字节写到字节 11（Features Exp）而不是字节 13。
# 单扇区的读对这一格放错不敏感（两边都算出 1 个扇区）；**跨 255 扇区边界的那次读才判得出来**：
# 设备看到 count=1 而 PRD 要 131584 字节，QEMU 直接丢掉命令 ⇒ 这条构建必须以红收场。
fault-ahci-count-hi = []

# 负样本（L3-C①）：走链时尾格多喂一个字节。字节数来自目录项、喂多少来自簇的扇区数，
# 两者只在尾格里不相等——多喂的那个字节是**文件之后的盘上内容**，而簇数、EOC、大小每一格
# 都还好看，只有哈希与宿主机对不上。没有这条注入，「尾格只喂真的属于文件的那几个字节」是修辞。
fault-fat32-tail = ["fat32-probe"]


# 追踪构建（只用于诊断调度问题）：每次切换在 ISR 里打一行。
# QEMU 的串口不节流所以代价可接受；真机上这么干会把中断窗口拖长——它不是产品路径。
trace-switch = []

# 基线量具自检（§12.4.1 规则 3 / P1）：在切换发出前多插一次 invlpg，
# P1 的均值必须显著变大，否则"切换成本"这条基线是修辞不是测量。
bench-switch-load = []

# 基线量具自检（手册 §12.4.1 规则 3）：在 #PF 恢复路径上注入一段确定性空循环，
# P3 均值必须跟着动。它不是"测性能"，是证明那条 P3 数字不是噪声。
bench-pf-load = []
