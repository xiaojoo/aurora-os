# crate 清单（手册 §2.5 R10 的机器可读版）
#
# 这是唯一来源：正文引用的每个 crate 都必须同时出现在这里与根 Cargo.toml 的 members，
# CI 用 cargo metadata 与实际包集合双向比对（python tools/aurora.py check-crates）。
# 垂直切片阶段保留主内核、真实用户产物与 ADR-247 的独立 capture 第二内核。

crate.aurora-kernel = "aurora-kernel"

# ADR-247：独立 capture 内核。固定链接基址，不依赖主内核分配器/锁/页表。
crate.aurora-capture = "aurora-capture"

# S1：内核与宿主机测试共用的 cpio newc 只读解析库。
crate.host-initramfs = "host-initramfs"

# M4-2：第一个用户程序的**产物**包。它不是库、没有 api/impl 之分，
# 登记它是为了让 §2.5 R10 的双向比对覆盖到"仓库里存在的包都必须有说明"这条。
crate.aurora-user-hello = "aurora-user-hello"

# W3 P5a（ADR-075 决策 1、Q8 裁决"不动 hello.elf"）：第二个用户产物。
# 它是**第一个真在 ring3 打 VMO 三个号（12/13/14）的调用方**，走第二个内嵌夹具，
# **不进签名链**（2026-11-09 裁决：签名包单载荷、余量只有 96 字节）。
crate.aurora-user-probe = "aurora-user-probe"

# S5c（BACKLOG §236）：第三个用户产物——**第一个交互式程序**（串口 shell）。
# 它经 ROLE_LOG 拿到控制台句柄，用 20/21 号读写；命令只用真实存在的 syscall。
crate.aurora-user-shell = "aurora-user-shell"

# FS-03 切片 D（ADR-108 决策 8）：第四个用户产物——**第一个在 ring3 打 22/24/25/26 的调用方**。
# 只在 `fs-open` 构建里被内核 `include_bytes!`；与 probe 同样**不进签名链**。
crate.aurora-user-fileprobe = "aurora-user-fileprobe"

# A2 骨架（总设计 docs/Aurora-OS-完整操作系统架构与Shell命令体系建设总设计-V1.0.md §9 A2，
# 2026-11-16 workbuddy）：第五个成员，**第一个用户态库（不是产物 ELF）**——只封装已存在的
# 调用号（1/3/7/8/9/10/11/15/16/17/18/19/20/21/22/24/25/26），不新增号、不占 23。
# ✓ 硬约束 2 已解除（2026-11-16 A2 接线片）：**第一个真实调用方 = user/shell**——其 syscall 底座
# （int 0x80 入口、con 读写、SI 页解析）已整体迁入本库（shell 域 unsafe 19→4 处），行为等价。
# 内核侧 argv/std 句柄继承见 docs/design/A2-用户运行时与外部命令执行-内核侧设计草案.md
# （草案，落地编号按分区归 workbuddy，需使用者批准）。
crate.aurora-user-runtime = "aurora-user-runtime"

# A2 切片（ADR-130）：第六个成员——**第一个经 A2 语义（argv 区 + std 句柄继承）启动的
# 外部 ELF**。只在 `a2-exec` 构建里被内核 include_bytes!；与 probe/fileprobe 同样不进签名链。
crate.aurora-user-execprobe = "aurora-user-execprobe"

# D4（ADR-154，2026-11-19）：第七个成员——**应用 SDK 的第一个样板**。
# 它不是空 SDK 骨架（硬约束 2）：这是一个**真能跑起来的用户程序**，演示
# ①只经 runtime 调号、②38/40 号读凭据并做授权判定、③44/45 号把文本写到屏幕上。
# 它是 `run /SDKDEMO.ELF` 的被测物，也是"怎么写一个 Aurora 应用"的活文档。
crate.aurora-user-sdkdemo = "aurora-user-sdkdemo"

# ---------------------------------------------------------------- 许可证策略（§11.2 R10 / ADR-009b）
#
# 白名单与"登记过的留空"的唯一来源就在这里，`check-sbom` 直接读这两段。
# ADR-009b（发布许可证）还没定 ⇒ 这五个成员**故意没有** license 字段：
# 留空必须是登记过的留空（带理由与到期条件），不是没人注意的空白，
# 也不是随手填一个 MIT 把它糊过去。

license.allow[] = "MIT"
license.allow[] = "Apache-2.0"
license.allow[] = "BSD-3-Clause"
license.allow[] = "BSD-2-Clause"
license.allow[] = "ISC"
license.allow[] = "Zlib"
license.allow[] = "MPL-2.0"

license.pending.aurora-kernel = "ADR-009b 未定（发布许可证由安全委员会在 M9 前确定，手册 §11.2/§15.4）"
license.pending.aurora-capture = "同上：kdump 第二内核，许可证随内核一起定"
license.pending.host-initramfs = "ADR-009b 未定；随内核一起确定发布许可证"
license.pending.aurora-user-hello = "同上：它是内核的产物夹具，许可证随内核一起定"
license.pending.aurora-user-probe = "同上：第二个用户产物夹具（W3 P5a），许可证随内核一起定"
license.pending.aurora-user-shell = "同上：第三个用户产物（S5c 串口 shell），许可证随内核一起定"
license.pending.aurora-user-fileprobe = "同上：第四个用户产物（FS-03 D ring3 文件探针），许可证随内核一起定"
license.pending.aurora-user-runtime = "同上：A2 用户态库骨架（总设计 §9 A2），许可证随内核一起定"
license.pending.aurora-user-execprobe = "同上：A2 外部命令探针（ADR-130），许可证随内核一起定"
license.pending.aurora-user-sdkdemo = "同上：D4 应用 SDK 样板（ADR-154，部分采纳），许可证随内核一起定"
