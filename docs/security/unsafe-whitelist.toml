#   指针来源：同读方向（`phys_of_in` 从目标 AS 页表翻译 + `via_hhdm()`）。
#   地址范围：单字节（`write_volatile(*mut u8)`），`pa + (at % PAGE)` ⇒ 不跨页。
#   对齐：字节写，无需对齐。
#   生命周期：当次调用内。
#   并发规则：整段在 `with_vmm_lock` 里；查询用 `_locked` 版（自取锁会撞 rank=20 重入）。
