# ADR-175：+1（U2 9 → 10）= `copy_from_user_in` 里那次 HHDM 别名的单字节读。
# 这一处是**全仓唯一一条不经 stac/clac 读用户内存的路径**（HHDM 别名是内核页，SMAP 不拦），
# 所以它不能靠「反正会 #PF」兜底——它根本不会 #PF。逐条写清：
#   指针来源：`phys_of_in(root, at)` 用**目标 AS 的页表**（`aspace_root(aslot)` 取根）翻译出的
#             物理地址，再经 `PhysAddr::via_hhdm()` 加 HHDM 偏移得到内核别名。不是用户 VA。
#   地址范围：单字节（`read_volatile(*const u8)`），`at` 与 `pa` 按同一 VA 算 ⇒ 不跨页。
#   对齐：字节读，无需对齐（`*const u8` 没有对齐要求）。
#   生命周期：当次调用内。不存指针、不返回引用、读完立即写进 `dst[done]`。
#   并发规则：与 `copy_from_user` 同一条——所有页表写者都在 VMM(20) 里；
#             **已修**（ADR-175 §七之二）：整段包在 `with_vmm_lock` 里，且用 `_locked` 版的两个查询
#   上下文约束：KERNEL（用例/调试路径）。可读**任意** AS 的页，正因如此才必须逐页校验。
#   由谁保证不变量：`copy_from_user_in` 自己——`va`/`end` 过 `USER_VA_TOP` 与 `COPY_MAX` 两关，
#             每页过 `aspace_effective_flags(aslot, page).user`，`phys_of_in` 返回 `None` 就拒。
#             少了 `.user` 那一关，内核就会替用户读它的内核页（负样本 N1）。
U2 = 13
# ADR-175 补记：+1（U2 10 → 11）= `copy_to_user_in` 里那次 HHDM 别名的单字节**写**。
