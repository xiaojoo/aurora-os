# P1a/P1b/P1c（ADR-063）共 7 处 FrameInfo unsafe：引导写入（bootstrap_frame_info）、
# 读 refcnt（fi_refcnt）、读 owner（fi_owner）、写 used（fi_set_used）、refcnt 加一（fi_inc_refcnt）、
# refcnt 减一（fi_dec_refcnt）、最终归还毒化（fi_final_free）。指针来自 phys_alloc_locked 分出的
# MOD_BOOT 帧 + HHDM，范围 [0, frame_info_frames)，AtomicU32 首字段 4 对齐，生命周期整个内核（永不归还），
# 全部持 PMM 锁（引导期单核 IF=0）；frame_get 前置"调用方已持参考"保证不与归还竞争。
# P2（ADR-064）+3：KBuf 清零（write_bytes）、as_slice（from_raw_parts）、as_mut_slice
# （from_raw_parts_mut）。指针 = HHDM + phys_alloc 连续帧基址，范围 [0,len<=cap)，u8 任意对齐，
# 生命周期绑 KBuf（OwnedFrames 字段，Drop 才归还），&self/&mut self 保证访问期不归还、无别名。
# P4（ADR-066）+6：phys_of/leaf_value 只读遍历（前提同 is_mapped：写者全在 VMM 内）；
# split_huge 走 PD 项、读旧大页项、填 512 叶子（PT 页来自 new_table_frame、尚未挂进 PD，
# 无并发读者）、单次对齐写发布 PD 项。全部持 VMM(20)，指针经 HHDM 可达自建表。
# P4a（ADR-074）+10：walk_leaf_in 的遍历（根表由调用方给，仍是自建表经 HHDM）、
# set_leaf_in 读/写叶子、aspace_map 的冲突预查与回滚清叶子、AspaceMapping::drop 清叶子、
# aspace_leaf 只读对照、new_table_frame_in 的清零。前提与既有 walk_leaf 逐字相同：
# va 规范、根是有效 PML4、持 VMM(20)；新增的只是"根可以是别的 AS"与"表页记进那个 AS 的清单"。
U2 = 53
