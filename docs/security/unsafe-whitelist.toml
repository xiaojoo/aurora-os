# unsafe 登记表（手册 §1.3 的唯一来源）
#
# 规则：
#   * 只有这里列出的 crate 可以含 unsafe；其余 crate 必须 #![forbid(unsafe_code)]
#   * CI 双向对账：登记了但实际 unsafe 统计为 0 -> 报“白名单虚报”；
#     实际有 unsafe 但未登记 -> 报“越权 unsafe”（§1.3 第 6 条）
#   * 每条都要写 reason 与 expires；到期未处理就得改成正式条目或删除该 unsafe
#
# 检查脚本：python tools/aurora.py check

[crate.aurora-kernel]
reason = "垂直切片阶段整个内核就是一个二进制 crate，异常桩/描述符表/端口 I/O 都在里面"
scope = "arch/x86_64/trap.rs(asm+描述符+CR2) · serial.rs(端口) · limine.rs(启动信息指针转引用) · arch/x86_64/cpuid.rs · main.rs(启动期 UnsafeCell)"
# 2026-11-06 那一刀：`trap/apic/smp/cpu/cpuid` 已从 kernel/src/ 平铺移进 kernel/src/arch/x86_64/（BACKLOG 77）。
# 下面两行里的裸名字（trap/cpu/apic/smp…）指的是**模块名**，不是文件路径；门禁按包计数，路径变化不影响它，但引用这些文件时请用新路径。
# M4-2 之后这条 scope 已经**不再完整**（sched/sync/apic/mm/cpu/smp/user/tsc 也都有 unsafe），
# 而门禁是按包计数的，所以这行写漏不会让检查失败——那正是它该被写全的理由。
# 逐包拆分之前，先把"这个包里 unsafe 集中在哪几类"说明白，而不是留一份 M1 时代的清单。
scope_actual = "asm 全局符号与异常桩(trap/sched/cpu) · 描述符表与 CR4/CR3(trap/cpu/mm) · 端口与 MMIO(serial/apic) · 页表遍历(mm) · per-CPU 静态区的裸指针读写(sched/sync/resource/smp/user/cpu) · 内联 asm 的取指/STAC-CLAC(user) · ktest 里的现场读回(main 与 ktests/*) · arch↔sched 回调表(hooks) · 句柄表里那一段连续物理内存的 volatile 字节/双字访问与 `UnsafeCell` 表(driver) · 驱动静态区取句柄(ahci，只剩 5 处，全部是拿句柄不是拿指针) · 崩溃现场的有界栈走(crash：两处 read_volatile，每处都先过「8 字节对齐 + 内核半区 + 已映射」三关，读回来的值只进记录、不解引用、不参与控制流)"
expires = "M2：按 §2.5 拆出 aurora-arch / aurora-hw / aurora-mm-core 后，本条改为逐 crate 登记"

# M4-2：第一个用户程序（测试夹具）。它的 unsafe 只有两类，都写在源码注释里。
[crate.aurora-user-probe]
reason = "第二个用户产物（W3 P5a）：unsafe 需求是 int 0x80 的四参入口、两处 RIP 相对 lea 取自己段的基址、两个自跳转，以及往自己 .slots 写结果与从 14 号返回的用户 VA 读回 8 字节；不碰任何内核对象"
scope = "main.rs：sys4 的 int 0x80（rax/rdi/rsi/rdx/r10）· slots_base/src_addr 的 lea（镜像基址在 4 GiB 之上，addr_of! 会退化成 R_X86_64_32S）· put 的原子写（偏移 0..=48）· _start 的读回比对（只读、同页内、先判返回值非负）· panic 与收尾自跳转"
expires = "P5c 之后若它开始打 11/15/16 或读 StartupInfo，unsafe 面会扩，那时回这条账重登记"

[crate.aurora-user-shell]
reason = "第三个用户产物（S5c→A2 接线后）：syscall 底座已迁 aurora-user-runtime，本包剩余 unsafe 需求只有 msgs_base 的 RIP 相对 lea 取基址、panic 自跳转、对自家静态 blob 的切片、以及对 rt::find_console（unsafe fn）的一次调用；不碰任何内核对象"
scope = "main.rs：msgs_base 的 lea 块 · msg 的 from_raw_parts（MSGS blob 内、常量偏移有界）· panic 自跳转 · _start 对 rt::find_console 的一次调用"
expires = "A2 接线后 unsafe 面已收窄到交互逻辑本身；若它重新长出 int 0x80 或读别的页，回这条账重登记"

# FS-03 切片 D（ADR-108 决策 8）：第四个用户产物 = ring3 文件探针。
[crate.aurora-user-fileprobe]
reason = "FS-03 切片 D（ADR-108 决策 8）的 ring3 文件探针：unsafe 需求只有 int 0x80 的三参入口与它的 unsafe fn 声明、一处 RIP 相对 lea 取自己 .slots 的基址（镜像基址在 4 GiB 之上，addr_of! 会退化成 R_X86_64_32S）、panic 与收尾两处自跳转，以及按固定偏移表对自己那一页的 volatile 字节/双字读写；不碰任何内核对象"
scope = "main.rs：sys3 的 int 0x80（rax/rdi/rsi/rdx）与其 unsafe fn 声明 · slots_base 的 lea · put/put_byte/get_byte/get_u32 四处 volatile 访问（偏移全在本页 0..1536，基址加常量偏移）· read_all/read_dir_all/_start 里把本页地址交给内核的三处调用 · panic 与 SYS_EXIT 后的自跳转"
expires = "FS-03 之后若它开始打写路径（23 号）或读别的页，unsafe 面会扩，那时回这条账重登记"

[crate.aurora-user-runtime]
reason = "A2 用户态运行时库（总设计切片，2026-11-16）：unsafe 需求是 int 0x80 的四参入口（含 r10 第四参）、把调用方传入的缓冲/路径指针与长度交给内核（长度上限在 safe 层先拒）、读内核交进来的 StartupInfo 那一页（只读、页内、先核魔数与 nhandles 上限）、以及 exit 的失败兜底自旋；不碰任何内核对象，不新增调用号"
scope = "src/lib.rs：syscall_abi 的 int 0x80（rax/rdi/rsi/rdx/r10）· 18 个封装函数各自的调用块 · find_console 的 read_unaligned（头 24 字节 + 最多 16 条描述，全在那一页内）"
expires = "A2 接线片（shell 迁入 runtime）之后 unsafe 面若无变化则维持；若新增号或读新页，回这条账重登记"

[crate.aurora-user-execprobe]
reason = "A2 外部命令探针（ADR-130）：unsafe 需求是 msgs_base 的 RIP 相对 lea、panic 自跳转、对自家静态 blob 的切片、以及对 rt::handle_of_role / rt::args_at 两个 unsafe fn 的调用；不碰任何内核对象"
scope = "src/main.rs：msgs_base 的 lea 块 · msg 的 from_raw_parts · panic 自跳转 · _start 的两处 runtime unsafe fn 调用"
expires = "A2 收尾后若 unsafe 面扩大，回这条账重登记"

[crate.aurora-user-hello]
reason = "它是产物而不是库：唯一的 unsafe 需求是 `int 0x80` 与一个自跳转，没有任何指针算术、没有内存操作、不碰任何内核对象"
scope = "main.rs：3 次 int 0x80（inlateout rax + in rdi/rsi）、panic 与收尾各一个 `jmp .` 自跳转"
expires = "M4-2 之后如果它继续当夹具，这两处仍然是全部 unsafe；多了就得回这条账"

