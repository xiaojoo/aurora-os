# 从 14 号返回的用户 VA 读回 8 字节、以及 P5c-2 新增的"从**请求的** VA 读回 8 字节"
# （同一判据：先要求返回逐字等于请求值才解引用，只读、8 字节落在同一页内）。
# 生命周期 = 本进程；单任务访问无并发；分类规则本轮从写死 user/hello 改成认 user/ 前缀。
U1 = 6
# P5c-3b（ADR-075）+2：轮询内核交进来的邮箱页（只读一个 u64、上限硬）、
# 以及装载器序列那个调用块（11/12/13/14/15/16 全是本程序自己的号，参数照 §4.4c）。
U5 = 6

[modules."user/fileprobe"]
# FS-03 切片 D：ring3 文件探针。U1 四处 = panic 自跳转、slots_base 的 lea 块、
# sys3 的 unsafe fn 声明与其 int 0x80。U5 八处 = 对自己那一页的四处 volatile 读写、
# 三处把本页地址交给内核（读/目录读/退出）与 _start 的那个 unsafe 块。
# 指针来源：唯一的基址是 `lea [rip + SLOTS]` 得到的本程序 .slots 页，偏移全是模块里那两张
# 常量表；内核写回来的字节由内核自己的 copy_to_user 校验（USER 页、可写）。
# 上下文 USER_ENTRY；不变量由 ABI 约定（号 rax、参数 rdi/rsi/rdx、返回 rax）与
# "偏移表两侧各写一遍、由读回的数对账"保证。生命周期 = 本任务；单任务访问无并发。
U1 = 4
U5 = 8

[modules."user/shell"]
# S5c→A2 接线后（2026-11-16）：syscall 底座（int 0x80 入口、find_console、con 读写）整体迁入
# aurora-user-runtime，本模块只剩交互逻辑。U1 两处 = msgs_base 的 RIP 相对 lea 取基址块、
# panic 自跳转。U5 三处 = msg 的 from_raw_parts（对自家静态 MSGS blob 的切片，常量偏移有界）、
# _start 对 rt::find_console（unsafe fn）的那一次调用、_start 对 rt::args_at（unsafe fn）的
# 那一次调用（A3：argv 一次性命令）——两个 si_va 同一份契约：内核 process_start 校验并映射、
# user+只读。上下文 USER_ENTRY；生命周期 = 本进程；无并发。
U1 = 2
U5 = 3

[modules."virtio"]
U4 = 10

[modules."vmo"]
# W3 P4（ADR-074）：VMO 对象表。指针来源有两类——
# ①本模块静态 `VmoCell(UnsafeCell<VmoTable>)` 的 `get()`（U4 两处：Sync 论证 + tbl()），
#   地址范围固定在这一个静态对象内，对齐由编译器保证，生命周期 'static，
#   并发规则：表结构与三本计数全在 VMM(20) 内读写，锁外不碰；
# ②帧的 HHDM 别名（U2 三处：create 清零、write、read），物理地址来自表里登记的帧号，
#   那些帧在 refs>0 期间不会被归还（归还只在 unref 到 0 时发生，且先在锁内清表项），
#   范围逐次不超过一页（k <= PAGE - po），对齐按字节，上下文 KERNEL 且持 VMM，
#   重叠拷贝用 memmove 语义（调用方的缓冲可能就映射在这个对象里）。
#   不变量由 `unsafe impl Sync for VmoCell` 上面那段论证与 vmo_write/vmo_read 的长度检查保证。
U2 = 3
U4 = 2

[modules."user/runtime"]
# A2（总设计切片，2026-11-16）：用户态运行时库。U1 三处 = syscall_abi 的 unsafe fn 声明
# 与其 int 0x80 块（照抄 shell 的 syscall3 模式加 r10 位）、find_console 的 unsafe fn 声明。
# U5 二十三处 = 18 个封装函数各自的 syscall_abi 调用块（把调用方传入的缓冲/路径指针与
# 长度交给内核）+ find_console 对 StartupInfo 页的 5 处 read_unaligned。
# 指针来源：①调用方栈缓冲（as_ptr/as_mut_ptr + len，长度上限在 safe 层先拒，
# 不给内核传未校验长度）；②SI 页（内核 process_start 校验并映射，user+只读，
# 首参 si_va 由 set_thread_arg 交进来）。地址范围 = 缓冲自身与 SI 一页内；
# 对齐 = read_unaligned 显式不假设对齐；上下文 USER_ENTRY；
# 不变量 = ABI 约定（号 rax、参数 rdi/rsi/rdx/r10、返回 rax 负值错误码）与 safe 层
# 长度/枚举编码检查；生命周期 = 调用栈内；并发 = 无共享可变状态（库无全局）。
U1 = 5
U5 = 35


[modules."user/execprobe"]
# A2（ADR-130，2026-11-16）：外部命令探针。U1 两处 = msgs_base 的 RIP 相对 lea 取基址、
# panic 自跳转。U5 三处 = msg 的 from_raw_parts（自家 MSGS blob、常量偏移有界）、
# _start 对 rt::handle_of_role / rt::args_at（两个 unsafe fn）的调用——si_va 由内核
# process_start 校验并映射（user+只读），argv 区界内性由 ADR-130 决策 2 的校验背书。
# 上下文 USER_ENTRY；生命周期 = 本进程；单任务访问无并发。
U1 = 3
U5 = 6

[modules."filesystem/fs_open"]
# A3（ADR-131，2026-11-17）：FAT32 单根挂载层的**运行期挂根**。U2 两处 = `port()` 的
# volatile 读与 `set_port()` 的 volatile 写（`core::ptr::addr_of!`/`addr_of_mut!`）。
# 为什么不是 `AtomicU8`：本模块属 storage 组，ADR-044 的棘轮规定"环内引用只许减不许增"，
# 引入 `core::sync::atomic` 会新增 storage→sync 的 3 个引用站点（实测）。
# 单写者：a3-exec 的编排在任何用户任务起来之前调一次 `set_port(3)`，此后整机只读；
# 单字节、无对齐问题；`addr_of!` 不创造引用（`static_mut_refs` 的正当写法）。
U2 = 2

[modules."user/runtime/exec"]
# A3 收尾（ADR-131）：装载与启动的编排层。U1 一处 = 静态 4 KiB 读块的 RIP 相对 lea
# （`.bss` 在 4 GiB 之上，`addr_of_mut!` 会退化成 R_X86_64_32S；实测 shell 链接时三处
# 引用该 section 越界）。切片本身由本模块独占（单线程用户程序，无并发窗口）。
U1 = 1

[modules."user/shell/registry"]
# A3 收尾：`run` 命令。U5 一处 = `rt::handle_of_role(si_va, ROLE_JOB)` 那一次调用——
# si_va 由内核 `process_start` 校验并映射（user+只读），契约原文在 runtime 侧。
U5 = 1
