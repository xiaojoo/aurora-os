# Aurora OS 垂直切片的引导配置（Limine 11.4.1 语法，依据本地 CONFIG.md）
#
# 配置搜索顺序（EFI 引导）：/boot/limine/limine.conf -> /boot/limine.conf
# -> /limine/limine.conf -> /limine.conf。本镜像把文件放在根目录。
# 路径里的 boot() 表示“配置文件所在的那个分区”，因此文件必须与配置在同一 ESP 上。
#
# 注意 kernel_path 指向 aurora.bin：内核产物在仓库里叫 aurora-kernel，
# 13 个字符超出 FAT 8.3；长名能不能被 Limine 的 FAT 驱动解析未核实，
# 所以镜像里用 8.3 安全名，避免把 M1 的成败押在未验证的 LFN 支持上。

timeout: 0
serial: yes

/Aurora OS vertical slice
    protocol: limine
    kernel_path: boot():/boot/aurora.bin
